<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>

    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>

    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg-grad)" />
  <rect width="1200" height="800" fill="url(#center-glow)" />
  <rect width="1200" height="800" fill="url(#arch-grid)" />

  <!-- Subtle Architectural Skyline Silhouette -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18" fill="none">
    <!-- Tower 1 -->
    <path d="M 180 720 L 180 340 L 260 280 L 340 340 L 340 720" />
    <line x1="260" y1="280" x2="260" y2="720" stroke-dasharray="4 4" />
    <line x1="180" y1="420" x2="340" y2="420" />
    <line x1="180" y1="520" x2="340" y2="520" />
    <line x1="180" y1="620" x2="340" y2="620" />

    <!-- Center High-Rise -->
    <path d="M 440 720 L 440 180 L 520 140 L 600 140 L 680 180 L 680 720" />
    <line x1="560" y1="140" x2="560" y2="720" stroke-dasharray="4 4" />
    <line x1="440" y1="260" x2="680" y2="260" />
    <line x1="440" y1="360" x2="680" y2="360" />
    <line x1="440" y1="460" x2="680" y2="460" />
    <line x1="440" y1="560" x2="680" y2="560" />
    <line x1="440" y1="640" x2="680" y2="640" />

    <!-- Tower 3 -->
    <path d="M 780 720 L 780 300 L 860 250 L 940 300 L 940 720" />
    <line x1="860" y1="250" x2="860" y2="720" stroke-dasharray="4 4" />
    <line x1="780" y1="400" x2="940" y2="400" />
    <line x1="780" y1="500" x2="940" y2="500" />
    <line x1="780" y1="600" x2="940" y2="600" />
    
    <!-- Horizon Line -->
    <line x1="60" y1="720" x2="1140" y2="720" stroke-opacity="0.3" stroke-width="2" />
  </g>

  <!-- Central Glass Card Badge -->
  <g transform="translate(600, 400)" filter="url(#blur-shadow)">
    <!-- Card Frame -->
    <rect x="-240" y="-130" width="480" height="260" rx="20" ry="20"
          fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Corner Accents -->
    <path d="M -225 -115 L -205 -115 M -225 -115 L -225 -95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 225 -115 L 205 -115 M 225 -115 L 225 -95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M -225 115 L -205 115 M -225 115 L -225 95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 225 115 L 205 115 M 225 115 L 225 95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Icon: Modern Building / Architecture -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Building Icon -->
      <path d="M -12 12 L -12 -8 L -4 -16 L 4 -16 L 12 -8 L 12 12 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
      <line x1="-6" y1="-4" x2="-6" y2="4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="0" y1="-8" x2="0" y2="4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="6" y1="-4" x2="6" y2="4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-14" y1="12" x2="14" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Typography -->
    <text x="0" y="16" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#94a3b8">
      ARCHITECTURAL PREVIEW
    </text>

    <text x="0" y="46" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#f8fafc">
      Imagery Coming Soon
    </text>

    <text x="0" y="78" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#38bdf8" fill-opacity="0.9">
      Download Official Brochure for Layout &amp; Details
    </text>
  </g>
</svg>
